<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ketan Dhadve — DevOps Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;
  --surface:#111;
  --border:#1e1e1e;
  --orange:#ff4500;
  --white:#f0f0f0;
  --muted:#555;
  --muted2:#2a2a2a;
  --display:'Bebas Neue',sans-serif;
  --body:'Space Grotesk',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--white);font-family:var(--body);font-size:14px;line-height:1.6;overflow-x:hidden}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  gap:48px;padding:22px 40px;
  background:rgba(10,10,10,0.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0.5px;transition:color .2s}
nav a:hover,nav a.active{color:var(--orange)}
.nav-logo{position:absolute;left:40px;font-family:var(--display);font-size:18px;letter-spacing:3px;color:var(--white)}

/* CORNER BRACKETS */
.brackets{position:absolute;inset:14px;pointer-events:none}
.brackets::before,.brackets::after,.brackets span::before,.brackets span::after{
  content:'';position:absolute;width:18px;height:18px;border-color:#2a2a2a;border-style:solid;
}
.brackets::before{top:0;left:0;border-width:1px 0 0 1px}
.brackets::after{top:0;right:0;border-width:1px 1px 0 0}
.brackets span::before{bottom:0;left:0;border-width:0 0 1px 1px}
.brackets span::after{bottom:0;right:0;border-width:0 1px 1px 0}

/* HERO */
#home{
  position:relative;min-height:100vh;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  grid-template-rows:auto 1fr auto auto;
  padding:88px 44px 36px;
}

.hero-title{grid-column:1;grid-row:1/3;align-self:center;padding-right:20px}
.hero-title h1{
  font-family:var(--display);
  font-size:clamp(80px,11vw,148px);
  line-height:0.9;
  color:var(--white);
}
.hero-role{
  display:block;
  font-family:var(--body);
  font-size:clamp(13px,1.6vw,18px);
  font-weight:600;
  letter-spacing:2px;
  color:var(--orange);
  text-transform:uppercase;
  margin-top:14px;
  min-height:1.4em;
}
.hero-role .cursor{
  display:inline-block;width:2px;height:0.9em;background:var(--orange);
  margin-left:3px;vertical-align:-2px;animation:blink 0.9s step-end infinite;
}
@keyframes blink{50%{opacity:0}}

.hero-photo{
  grid-column:2;grid-row:1/4;
  width:270px;align-self:stretch;
  position:relative;overflow:hidden;
  background:#0d0d0d;
  border:1px solid var(--border);
  margin:0 24px;
}
.hero-photo img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  display:block;
}
.hero-photo-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#161616,#0a0a0a);
}
.hero-photo-placeholder span{
  font-family:var(--display);font-size:64px;letter-spacing:4px;color:#2a2a2a;
}
.hero-photo-label{
  position:absolute;bottom:12px;left:12px;
  font-size:9px;color:var(--orange);
  letter-spacing:3px;font-weight:700;text-transform:uppercase;
}

.hero-available{
  grid-column:3;grid-row:1;
  text-align:right;align-self:start;padding-top:8px;
  font-size:11px;color:var(--muted);letter-spacing:0.5px;
}
.dot{
  display:inline-block;width:6px;height:6px;
  background:#00cc66;border-radius:50%;margin-right:6px;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}

.hero-bio{
  grid-column:3;grid-row:2;align-self:center;
  font-size:12px;color:var(--muted);line-height:1.9;
  max-width:240px;justify-self:end;padding-left:20px;
}

.hero-year{grid-column:1;grid-row:3;align-self:end;font-size:10px;color:var(--muted);letter-spacing:1px}

.hero-cta{grid-column:3;grid-row:3;justify-self:end;align-self:end}
.hero-cta a{
  display:inline-block;background:var(--orange);
  color:#fff;text-decoration:none;
  padding:13px 28px;font-size:13px;font-weight:700;
  letter-spacing:0.5px;transition:background .2s;
}
.hero-cta a:hover{background:#ff6020}

.hero-links{
  grid-column:1/4;grid-row:4;
  display:flex;justify-content:space-between;
  border-top:1px solid var(--border);
  padding-top:14px;margin-top:28px;
}
.hero-links a{
  font-size:11px;color:var(--muted);text-decoration:none;
  letter-spacing:1px;text-transform:uppercase;transition:color .2s;
}
.hero-links a:hover{color:var(--white)}

/* SECTIONS */
section:not(#home){padding:100px 44px;border-top:1px solid var(--border)}
.label{font-size:10px;color:var(--orange);letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:52px}

/* STATS */
#stats{padding:60px 44px;border-top:1px solid var(--border)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.stat-card{background:var(--surface);border:1px solid var(--border);padding:28px 20px;text-align:center;transition:border-color .2s}
.stat-card:hover{border-color:var(--orange)}
.stat-number{font-family:var(--display);font-size:44px;color:var(--white);line-height:1}
.stat-number .suffix{color:var(--orange)}
.stat-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.about-title{font-family:var(--display);font-size:clamp(44px,5.5vw,80px);line-height:0.92;margin-bottom:28px}
.about-text{font-size:13px;color:var(--muted);line-height:1.95;margin-bottom:18px}
.skills-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.skill-item{background:var(--surface);border:1px solid var(--border);padding:14px 16px;transition:border-color .2s}
.skill-item:hover{border-color:var(--orange)}
.skill-item strong{display:block;color:var(--white);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.skill-item span{font-size:11px;color:var(--muted)}

/* EXPERIENCE */
.exp-block+.exp-block{margin-top:48px}
.exp-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:28px}
.exp-company{font-family:var(--display);font-size:42px;letter-spacing:1px}
.exp-date{font-size:11px;color:var(--muted)}
.exp-role{font-size:12px;color:var(--orange);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:28px}
.exp-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:14px 48px}
.exp-list li{font-size:12px;color:var(--muted);line-height:1.75;padding-left:14px;border-left:1px solid var(--border);transition:border-color .2s,color .2s}
.exp-list li:hover{border-color:var(--orange);color:var(--white)}

/* PROJECTS */
.projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.projects-grid.single{grid-template-columns:1fr}
.project-card{background:var(--surface);border:1px solid var(--border);padding:36px;position:relative;overflow:hidden;transition:border-color .2s}
.project-card:hover{border-color:var(--orange)}
.project-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.project-card:hover::after{transform:scaleX(1)}
.proj-num{font-family:var(--display);font-size:52px;color:var(--muted2);line-height:1;margin-bottom:14px}
.proj-title{font-size:17px;font-weight:700;margin-bottom:10px}
.proj-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:9px;color:var(--orange);border:1px solid var(--orange);padding:3px 8px;letter-spacing:1.5px;text-transform:uppercase}
.proj-list{list-style:none}
.proj-list li{font-size:12px;color:var(--muted);line-height:1.75;padding-left:14px;position:relative;margin-bottom:5px}
.proj-list li::before{content:'▸';position:absolute;left:0;color:var(--orange);font-size:9px;top:3px}

/* GITHUB FEED */
.gh-head{display:flex;justify-content:space-between;align-items:baseline;margin:56px 0 20px}
.gh-head h3{font-family:var(--display);font-size:26px;letter-spacing:1px;font-weight:400}
.gh-head a{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;text-decoration:none}
.gh-head a:hover{color:var(--orange)}
.gh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.gh-card{background:var(--surface);border:1px solid var(--border);padding:20px;transition:border-color .2s;text-decoration:none;color:var(--white);display:block}
.gh-card:hover{border-color:var(--orange)}
.gh-card-name{font-size:13px;font-weight:700;margin-bottom:8px;word-break:break-word}
.gh-card-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:14px;min-height:34px}
.gh-card-meta{display:flex;gap:14px;font-size:10px;color:var(--muted);letter-spacing:0.5px}
.gh-card-meta span{display:flex;align-items:center;gap:4px}
.gh-lang-dot{width:7px;height:7px;border-radius:50%;background:var(--orange);display:inline-block}
.gh-status{font-size:11px;color:var(--muted);letter-spacing:0.5px;padding:20px 0}

/* STACK */
.stack-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.stack-card{background:var(--surface);border:1px solid var(--border);padding:24px;transition:border-color .2s}
.stack-card:hover{border-color:var(--orange)}
.stack-cat{font-size:9px;color:var(--orange);letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.stack-items{font-size:11px;color:var(--muted);line-height:2.1}

/* CONTACT */
#contact{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.contact-title{font-family:var(--display);font-size:clamp(52px,7vw,100px);line-height:0.9;margin-bottom:20px}
.contact-sub{font-size:13px;color:var(--muted);line-height:1.85;margin-bottom:32px}
.contact-links{display:flex;flex-direction:column;gap:2px}
.c-link{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);padding:16px 20px;text-decoration:none;color:var(--white);font-size:13px;transition:border-color .2s}
.c-link:hover{border-color:var(--orange)}
.c-label{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.c-arrow{color:var(--orange);font-size:18px}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:22px 44px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* FADE IN */
.fi{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.fi.on{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  nav{gap:20px}
  .nav-logo{position:static}
  #home{grid-template-columns:1fr;padding:80px 20px 32px}
  .hero-title{grid-column:1;grid-row:1}
  .hero-photo{grid-column:1;grid-row:2;width:100%;height:360px;margin:20px 0}
  .hero-available{grid-column:1;grid-row:3;text-align:left}
  .hero-bio{grid-column:1;grid-row:4;max-width:100%;padding:0}
  .hero-year{grid-column:1;grid-row:5}
  .hero-cta{grid-column:1;grid-row:6;justify-self:start}
  .hero-links{grid-column:1;grid-row:7}
  section:not(#home){padding:60px 20px}
  .about-grid,.projects-grid,.exp-list{grid-template-columns:1fr}
  .skills-grid{grid-template-columns:1fr 1fr}
  .stack-grid{grid-template-columns:1fr 1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .gh-grid{grid-template-columns:1fr}
  #contact{grid-template-columns:1fr}
  footer{flex-direction:column;gap:8px;text-align:center}
  .exp-head{flex-direction:column;gap:6px}
}
</style>
</head>
<body>

/* ============================================================
   BEHAVIOR: fade-ins, nav scrollspy, typing effect, counters, GitHub feed
   ============================================================ */
function initFadeIns(){
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('on'); });
  }, { threshold: 0.08 });
  document.querySelectorAll('.fi').forEach(el => io.observe(el));
}

function initNavScrollSpy(){
  const secs = document.querySelectorAll('section[id]');
  const links = document.querySelectorAll('nav a');
  window.addEventListener('scroll', () => {
    let cur = '';
    secs.forEach(s => { if (window.scrollY >= s.offsetTop - 120) cur = s.id; });
    links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + cur));
  });
}

function initTypingEffect(){
  const el = document.getElementById('hero-role');
  if (!el) return;
  const roles = DATA.roles;
  let roleIndex = 0, charIndex = 0, deleting = false;

  function tick(){
    const current = roles[roleIndex];
    if (!deleting){
      charIndex++;
      el.innerHTML = current.slice(0, charIndex) + '<span class="cursor"></span>';
      if (charIndex === current.length){
        deleting = true;
        setTimeout(tick, 1400);
        return;
      }
    } else {
      charIndex--;
      el.innerHTML = current.slice(0, charIndex) + '<span class="cursor"></span>';
      if (charIndex === 0){
        deleting = false;
        roleIndex = (roleIndex + 1) % roles.length;
      }
    }
    setTimeout(tick, deleting ? 35 : 75);
  }
  tick();
}

function initCounters(){
  const nums = document.querySelectorAll('.stat-count');
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      const target = parseFloat(el.dataset.target);
      const isFloat = !Number.isInteger(target);
      const duration = 1200;
      const start = performance.now();
      function step(now){
        const progress = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const val = target * eased;
        el.textContent = isFloat ? val.toFixed(1) : Math.round(val);
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = isFloat ? target.toFixed(1) : target;
      }
      requestAnimationFrame(step);
      io.unobserve(el);
    });
  }, { threshold: 0.5 });
  nums.forEach(el => io.observe(el));
}

async function initGithubFeed(){
  const feed = document.getElementById('gh-feed');
  if (!feed) return;
  try {
    const res = await fetch(`https://api.github.com/users/${DATA.githubUser}/repos?sort=updated&per_page=6`);
    if (!res.ok) throw new Error('GitHub API error ' + res.status);
    const repos = await res.json();
    if (!Array.isArray(repos) || repos.length === 0){
      feed.textContent = 'No public repositories found.';
      return;
    }
    feed.className = 'gh-grid fi';
    feed.innerHTML = repos.slice(0, 6).map(r => `
      <a class="gh-card" href="${r.html_url}" target="_blank">
        <div class="gh-card-name">${r.name}</div>
        <div class="gh-card-desc">${r.description ? r.description : 'No description provided.'}</div>
        <div class="gh-card-meta">
          ${r.language ? `<span><span class="gh-lang-dot"></span>${r.language}</span>` : ''}
          <span>★ ${r.stargazers_count}</span>
          <span>Updated ${new Date(r.updated_at).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</span>
        </div>
      </a>
    `).join('');
    initFadeIns();
  } catch (err) {
    feed.textContent = 'Could not load live GitHub data right now — visit the profile directly above.';
  }
}
